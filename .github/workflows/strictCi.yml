name: Strict CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Strict Code Quality Gate
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v5
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy xenon pytest-cov
    
      # 🔍 Linting (strenger als Standard)
      - name: Ruff (strict)
        run: ruff check src/ tests/ --select ALL --ignore D203,D212
    
      # 🎨 Format Check
      - name: Black
        run: black --target-version py312 --check src/ tests/
    
      # 🔐 Security
      - name: Bandit
        run: bandit -r src/ -ll
    
      # 🧠 Typprüfung (wichtig für KI Code)
      - name: Mypy (strict)
        run: mypy src/ --strict
    
      # 📉 Komplexität begrenzen (killt Spaghetti Code)
      - name: Xenon complexity gate
        run: xenon --max-absolute B --max-modules A --max-average A src/
    
      # 🧪 Tests + Coverage
      - name: Pytest with coverage
        run: pytest tests/ -v --cov=src --cov-report=term --cov-fail-under=80
    
      # 🚫 Optional: verbiete TODOs im Main Branch
      - name: Fail on TODOs
        run: |
          if grep -R "TODO" src/; then
            echo "TODOs found. Failing build."
            exit 1
          fi
