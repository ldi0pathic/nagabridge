[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nagabridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21.0",
    "paho-mqtt>=1.6.0",
    "pycryptodome>=3.19.0",
    "ecdsa>=0.18.0",
    "crc>=7.0.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-paho-mqtt>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nagabridge = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 150

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",
    "S101",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true