[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nagabridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21.0",
    "paho-mqtt>=1.6.0",
    "pycryptodome>=3.19.0",
    "ecdsa>=0.18.0",
    "crc>=7.0.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
